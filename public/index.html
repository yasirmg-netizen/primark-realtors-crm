<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Primark Realtors CRM</title>
<link rel="icon" href="/logo.png" />
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0F1420; }
  body { font-family: Inter, -apple-system, Segoe UI, sans-serif; color:#F1F3F7; line-height:1.45; }
  :root { --bg-deep:#0F1420; --surface:#171E2E; --surface-raised:#1F2839; --border:#2A3448; --gold:#C9A961;
    --gold-dim:#8A7847; --teal:#2DD4BF; --muted:#9BA8BA; --danger:#F0777C; --green:#5FD98A; }
  .app { min-height:100vh; display:flex; }
  .sidebar { width: 220px; background: #0B0F19; border-right: 1px solid var(--border); padding: 20px 14px; flex-shrink:0; display:flex; flex-direction:column; }
  .brand { font-family: Georgia, serif; font-size: 16px; color: var(--gold); margin-bottom: 4px; display:flex; align-items:center; gap:8px; }
  .brand img.logo { width: 28px; height: 28px; border-radius: 6px; flex-shrink:0; }
  .login-logo { width: 56px; height: 56px; border-radius: 10px; margin-bottom: 14px; }
  .brand-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 24px; letter-spacing: 1px; text-transform: uppercase; }
  .navitem { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; color: var(--muted); font-size:13.5px; cursor:pointer; margin-bottom:2px; }
  .navitem:hover { background: var(--surface); color: #F1F3F7; }
  .navitem.active { background: var(--surface-raised); color: var(--gold); font-weight: 600; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap; }
  .content { padding: 22px 24px; overflow-y:auto; flex:1; }
  h1.page-title { font-family: Georgia, serif; font-size:22px; margin:0 0 4px 0; }
  .page-sub { font-size:13px; color:var(--muted); margin:0 0 20px 0; line-height:1.5; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-bottom:22px; }
  .kpi-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-width:0; overflow:hidden; }
  .kpi-label { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; }
  .kpi-value { font-size:22px; font-weight:700; font-family: Inter, sans-serif; font-variant-numeric: tabular-nums; letter-spacing:-0.01em; overflow-wrap:break-word; line-height:1.25; }
  .kpi-value.gold { color: var(--gold); } .kpi-value.teal { color: var(--teal); } .kpi-value.danger { color: var(--danger); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:18px; }
  .card-title { font-size:14px; font-weight:600; margin:0 0 14px 0; }
  .funnel { display:flex; gap:2px; flex-wrap:wrap; }
  .funnel-seg { flex:1; min-width:70px; padding:12px 6px; text-align:center; border-radius:6px; font-size:11px; }
  .funnel-count { font-size:17px; font-weight:700; font-family: Inter, sans-serif; font-variant-numeric: tabular-nums; }
  input, select, textarea { background:var(--surface-raised); border:1px solid var(--border); color:#F1F3F7; border-radius:8px; padding:9px 11px; font-size:13.5px; font-family:inherit; outline:none; width:100%; }
  button.primary { background: var(--gold); color:#1A1408; border:none; border-radius:8px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--border); color:#F1F3F7; border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; }
  button.danger { background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer; }
  a.call-btn, a.wa-btn, a.email-btn { display:inline-flex; align-items:center; gap:5px; text-decoration:none; padding:5px 10px; border-radius:6px; font-size:12px; font-weight:600; margin-right:6px; white-space:nowrap; }
  a.call-btn { background:#1E2A44; color:#8FB3F5; }
  a.wa-btn { background:#25D366; color:#0B3D20; }
  a.email-btn { background:var(--surface-raised); border:1px solid var(--border); color:var(--gold); }
  a.call-btn svg, a.wa-btn svg, a.email-btn svg { flex-shrink:0; }
  table.leads-table { width:100%; border-collapse:collapse; font-size:13px; }
  table.leads-table th { text-align:left; color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.leads-table td { padding:10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .badge { padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .row-btn { background:transparent; border:none; color:var(--gold); cursor:pointer; font-size:12.5px; font-weight:600; }
  .overdue { color: var(--danger); font-weight:600; }
  .drawer-backdrop { position:fixed; inset:0; background:rgba(5,7,12,0.6); display:flex; justify-content:flex-end; z-index:50; }
  .drawer { width:440px; max-width:94vw; background:var(--bg-deep); border-left:1px solid var(--border); height:100%; overflow-y:auto; padding:22px; }
  .field-row { margin-bottom:14px; }
  .field-row label { display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; text-transform:uppercase; }
  .two-col { display:flex; gap:12px; flex-wrap:wrap; }
  .two-col > .field-row { flex:1; min-width:150px; }
  .comment { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .audit-entry { background:transparent; border-left:2px solid var(--gold-dim); padding:6px 10px; margin-bottom:8px; font-size:12px; color:var(--muted); font-style:italic; }
  .audit-entry strong { color:var(--gold); font-style:normal; }
  .comment-meta { font-size:11px; color:var(--muted); margin-top:4px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-raised); border:1px solid var(--gold-dim); padding:10px 18px; border-radius:8px; font-size:13px; z-index:99; }
  .filter-row { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .filter-row select { width:auto; min-width:130px; }
  .dropzone { border:1.5px dashed var(--border); border-radius:12px; padding:34px; text-align:center; color:var(--muted); cursor:pointer; }
  .rep-row { display:grid; grid-template-columns: 1.4fr 0.7fr 0.7fr 0.7fr 0.9fr 1fr; gap:8px; padding:10px 4px; font-size:13px; border-bottom:1px solid var(--border); align-items:center; }
  .rep-head { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .table-scroll { overflow-x:auto; }
  .checkline { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }
  .checkline input { width:auto; }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-card { width:340px; max-width:100%; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:32px 28px; }
  .login-card h1 { font-family: Georgia, serif; color:var(--gold); font-size:22px; margin:0 0 4px; }
  .login-card p { color:var(--muted); font-size:12.5px; margin:0 0 22px; }
  .login-error { color: var(--danger); font-size:12.5px; margin-top:10px; }
  @media (max-width: 760px) {
    .app { flex-direction:column; }
    .sidebar { width:100%; flex-direction:row; align-items:center; overflow-x:auto; padding:12px; gap:4px; }
    .sidebar .brand { font-size:0; margin:0 8px 0 0; }
    .sidebar .brand img.logo { width:26px; height:26px; }
    .sidebar .brand-sub, .sidebar .sidebar-footer { display:none; }
    .navitem { margin-bottom:0; white-space:nowrap; }
    .content { padding:16px; }
    .drawer { width:100%; max-width:100%; }
    .rep-row { grid-template-columns: 1fr 0.6fr 0.6fr 0.6fr; font-size:12px; }
    .rep-row > div:nth-child(5), .rep-row > div:nth-child(6) { display:none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

const SOURCES = ["Instagram", "Facebook", "Google Ads", "LinkedIn", "Website", "Referral", "Walk-in", "Other"];
const STATUSES = ["New", "Disqualified", "Contacted", "Follow-up Scheduled", "Qualified", "Proposal Sent", "Negotiation", "Won", "Lost"];
const STAGE_PROBABILITY = { New: 0.1, Disqualified: 0, Contacted: 0.2, "Follow-up Scheduled": 0.3, Qualified: 0.5, "Proposal Sent": 0.65, Negotiation: 0.8, Won: 1, Lost: 0 };
const CLOSED_STATUSES = ["Won", "Lost", "Disqualified"];
const DISQUALIFY_REASONS = ["Invalid contact info", "Not interested", "Budget mismatch", "Duplicate / spam", "Out of service area", "Other"];
const CONFIGURATIONS = ["1BHK", "2BHK", "3BHK", "4BHK+", "Villa", "Plot", "Commercial", "Other"];
const LEAD_TYPES = ["Buyer", "Investor", "Tenant"];
const SITE_VISIT_STATUSES = ["Not scheduled", "Scheduled", "Completed", "No-show", "Rescheduled"];
// Placeholders filled in per-lead at send time: {name} {rep} {property} {visitDate}
const WHATSAPP_TEMPLATES = [
  { label: "Follow-up check-in", text: "Hi {name}, this is {rep} from Primark Realtors. Just following up on your interest in {property}. Do you have a few minutes to chat today?" },
  { label: "Site visit reminder", text: "Hi {name}, looking forward to your site visit for {property} on {visitDate}. See you then!" },
  { label: "Thanks for visiting", text: "Hi {name}, thank you for visiting {property} with us. Let us know if any questions came up after the visit." },
  { label: "Documents pending", text: "Hi {name}, just a reminder to share your KYC documents for {property} at your earliest convenience so we can move forward." },
];

const root = document.getElementById("root");
let state = {
  token: localStorage.getItem("ll_token") || null,
  user: null,
  leads: [],
  tab: "dashboard",
  selectedId: null,
  filters: { search: "", source: "All", status: "All" },
  toast: null,
  users: [],
  campaigns: [],
  campaignsLoaded: false,
  teamRoster: [],
  loading: true,
};

function money(n) { return "\u20B9" + Math.round(n || 0).toLocaleString("en-IN"); }
// Extra safety net on top of the CSS fix - very large crore-level figures
// get a smaller font so they never risk pushing past the card's edge.
function moneyValueHTML(n, cssClass) {
  const str = money(n);
  const size = str.length > 14 ? "17px" : str.length > 11 ? "19px" : str.length > 9 ? "21px" : "22px";
  return `<div class="kpi-value ${cssClass || ""}" style="font-size:${size};">${str}</div>`;
}
function fmtDate(iso) { if (!iso) return "\u2014"; const d = new Date(iso); return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" }); }
function fmtDateTime(iso) { if (!iso) return "\u2014"; const d = new Date(iso); return d.toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); }
function daysBetween(a, b) { return Math.floor((a - b) / 86400000); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function telHref(phone) { const digits = String(phone || "").replace(/\D/g, ""); if (!digits) return "#"; return "tel:+" + (digits.length === 10 ? "91" + digits : digits); }
function waHref(phone, text) { const digits = String(phone || "").replace(/\D/g, ""); if (!digits) return "#"; const base = "https://wa.me/" + (digits.length === 10 ? "91" + digits : digits); return text ? base + "?text=" + encodeURIComponent(text) : base; }

const ICON_PHONE = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.01-.24c1.12.37 2.33.57 3.58.57a1 1 0 011 1V20a1 1 0 01-1 1C10.61 21 3 13.39 3 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.46.57 3.58a1 1 0 01-.25 1.01l-2.2 2.2z"/></svg>`;
const ICON_WHATSAPP = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm5.5 14.3c-.2.6-1.4 1.2-1.9 1.3-.5.1-1.1.1-1.8-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 1-2.2.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.5.7 1.8.8 1.9.1.2.1.3 0 .5-.1.2-.2.3-.3.5-.2.2-.3.3-.5.5-.2.2-.3.4-.1.7.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1.2-.2.7-.8.9-1.1.2-.3.4-.2.6-.1.2.1 1.5.7 1.8.8.3.1.4.2.5.3.1.2.1.7-.1 1.3z"/></svg>`;
const ICON_EMAIL = `<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v.01L12 12l8-5.99V6H4zm16 2.24l-7.4 5.55a1 1 0 01-1.2 0L4 8.24V18h16z"/></svg>`;

function callBtnHTML(phone, label) {
  if (!phone) return "";
  return `<a class="call-btn" href="${telHref(phone)}">${ICON_PHONE}${label || "Call"}</a>`;
}
function waBtnHTML(phone, label, prefilledText) {
  if (!phone) return "";
  return `<a class="wa-btn" href="${waHref(phone, prefilledText)}" target="_blank">${ICON_WHATSAPP}${label || "WhatsApp"}</a>`;
}
function emailBtnHTML(email, label) {
  if (!email) return "";
  return `<a class="email-btn" href="mailto:${esc(email)}">${ICON_EMAIL}${label || "Email"}</a>`;
}

const STATUS_STYLE = {
  New: { bg: "#1E2A44", text: "#8FB3F5" }, Disqualified: { bg: "#332E22", text: "#C9B380" },
  Contacted: { bg: "#243447", text: "#7ED0E8" }, "Follow-up Scheduled": { bg: "#3A2F1A", text: "#E8C170" },
  Qualified: { bg: "#1F3A33", text: "#6BD6B8" }, "Proposal Sent": { bg: "#2E2447", text: "#C39CE8" },
  Negotiation: { bg: "#3A2A1F", text: "#F0A868" }, Won: { bg: "#1B3A28", text: "#5FD98A" }, Lost: { bg: "#3A1F22", text: "#F08484" },
};

async function api(path, opts) {
  opts = opts || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const res = await fetch("/api" + path, Object.assign({}, opts, { headers }));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

function showToast(msg) { state.toast = msg; render(); setTimeout(() => { state.toast = null; render(); }, 2600); }

async function loadLeads() {
  const data = await api("/leads");
  state.leads = data.leads;
  render();
  try { const c = await api("/campaigns"); state.campaigns = c.campaigns; } catch (e) {}
  if (state.user && (state.user.role === "admin" || state.user.role === "super_admin")) {
    try { const u = await api("/users"); state.teamRoster = u.users.filter((x) => x.active); } catch (e) {}
  }
}

async function login(username, password) {
  try {
    const data = await api("/login", { method: "POST", body: JSON.stringify({ username, password }) });
    state.token = data.token; state.user = data.user;
    localStorage.setItem("ll_token", data.token);
    await loadLeads();
  } catch (e) {
    state.loginError = e.message; render();
  }
}
function logout() { state.token = null; state.user = null; localStorage.removeItem("ll_token"); render(); }
async function changeOwnPassword() {
  const current = prompt("Your current password:");
  if (!current) return;
  const next = prompt("New password (at least 6 characters):");
  if (!next) return;
  try {
    await api("/me/password", { method: "POST", body: JSON.stringify({ currentPassword: current, newPassword: next }) });
    showToast("Password updated");
  } catch (e) { showToast(e.message); }
}

async function boot() {
  if (state.token) {
    try {
      const me = await api("/me");
      state.user = me.user;
      await loadLeads();
    } catch (e) { state.token = null; localStorage.removeItem("ll_token"); }
  }
  state.loading = false;
  render();
}

function computeStats(leads, team) {
  const now = Date.now();
  const startOfToday = new Date(); startOfToday.setHours(0, 0, 0, 0);
  const active = leads.filter((l) => !CLOSED_STATUSES.includes(l.status));
  const newToday = leads.filter((l) => new Date(l.created_at) >= startOfToday).length;
  const pending = active.filter((l) => l.follow_up_date && new Date(l.follow_up_date) >= startOfToday).length;
  const aging = active.filter((l) => l.follow_up_date && new Date(l.follow_up_date) < startOfToday)
    .map((l) => Object.assign({}, l, { daysOverdue: daysBetween(now, new Date(l.follow_up_date).getTime()) }))
    .sort((a, b) => b.daysOverdue - a.daysOverdue);
  const wonThisMonth = leads.filter((l) => l.status === "Won" && new Date(l.created_at).getMonth() === new Date().getMonth()).length;
  const pipelineValue = active.reduce((s, l) => s + (l.deal_value || 0), 0);
  const weightedValue = active.reduce((s, l) => s + (l.deal_value || 0) * (STAGE_PROBABILITY[l.status] || 0), 0);
  const bySource = SOURCES.map((s) => ({ name: s, value: leads.filter((l) => l.source === s).length })).filter((x) => x.value > 0);
  const byStatus = STATUSES.map((s) => ({ name: s, value: leads.filter((l) => l.status === s).length }));
  const repNames = Array.from(new Set(leads.map((l) => l.assigned_to_name).filter(Boolean)));
  const byRep = repNames.map((rep) => {
    const mine = leads.filter((l) => l.assigned_to_name === rep);
    const won = mine.filter((l) => l.status === "Won").length;
    return { rep, total: mine.length, won, pending: mine.filter((l) => !CLOSED_STATUSES.includes(l.status)).length,
      conversion: mine.length ? Math.round((won / mine.length) * 100) : 0,
      pipelineValue: mine.filter((l) => !CLOSED_STATUSES.includes(l.status)).reduce((s, l) => s + (l.deal_value || 0), 0) };
  });
  const disqualified = leads.filter((l) => l.status === "Disqualified");
  const byReason = DISQUALIFY_REASONS.map((r) => ({ reason: r, count: disqualified.filter((l) => (l.disqualify_reason || "Other") === r).length })).filter((x) => x.count > 0);
  const upcomingVisits = active.filter((l) => l.site_visit_status === "Scheduled" && l.site_visit_date).sort((a, b) => new Date(a.site_visit_date) - new Date(b.site_visit_date));
  const campaignNames = Array.from(new Set(leads.map((l) => l.campaign).filter(Boolean)));
  const byCampaign = campaignNames.map((c) => {
    const mine = leads.filter((l) => l.campaign === c);
    const won = mine.filter((l) => l.status === "Won").length;
    return { campaign: c, total: mine.length, won,
      conversion: mine.length ? Math.round((won / mine.length) * 100) : 0,
      pipelineValue: mine.filter((l) => !CLOSED_STATUSES.includes(l.status)).reduce((s, l) => s + (l.deal_value || 0), 0) };
  }).sort((a, b) => b.total - a.total);
  return { totalLeads: leads.length, newToday, pending, aging, wonThisMonth, pipelineValue, weightedValue, bySource, byStatus, byRep, disqualified, byReason, upcomingVisits, byCampaign, startOfToday };
}

function bars(data, labelKey, valueKey, color) {
  const max = Math.max(1, ...data.map((d) => d[valueKey]));
  return data.map((d) => `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <div style="width:120px;font-size:12px;color:var(--muted);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d[labelKey])}</div>
      <div style="flex:1;background:var(--surface-raised);border-radius:4px;height:16px;overflow:hidden;">
        <div style="width:${(d[valueKey] / max * 100)}%;height:100%;background:${color};border-radius:4px;"></div>
      </div>
      <div style="width:28px;font-size:12px;font-family:monospace;text-align:right;">${d[valueKey]}</div>
    </div>`).join("");
}

function leadRow(l, canReassign) {
  const overdue = l.follow_up_date && new Date(l.follow_up_date) < state.stats.startOfToday && !CLOSED_STATUSES.includes(l.status);
  return `<tr>
    <td>${esc(l.name)}${l.property_interest ? `<div style="font-size:11px;color:var(--muted)">${esc(l.property_interest)}</div>` : ""}</td>
    <td>
      ${l.phone ? callBtnHTML(l.phone) + waBtnHTML(l.phone) : "\u2014"}
      ${l.email ? emailBtnHTML(l.email) : ""}
      <div style="font-size:11px;color:var(--muted);margin-top:4px;">${esc(l.phone)}</div>
    </td>
    <td>${esc(l.source)}${l.campaign ? `<div style="font-size:11px;color:var(--muted)">${esc(l.campaign)}</div>` : ""}</td>
    <td><span class="badge" style="background:${STATUS_STYLE[l.status].bg};color:${STATUS_STYLE[l.status].text};">${esc(l.status)}</span>
      ${l.status === "Disqualified" && l.disqualify_reason ? `<div style="font-size:11px;color:var(--muted);margin-top:3px;">${esc(l.disqualify_reason)}</div>` : ""}</td>
    <td>${canReassign ? `<select style="width:auto;min-width:130px;padding:5px 8px;font-size:12px;" onchange="reassignLead('${l.id}', this.value)">
      ${state.teamRoster.map((u) => `<option value="${u.id}" ${l.assigned_to === u.id ? "selected" : ""}>${esc(u.name)}</option>`).join("")}
    </select>` : esc(l.assigned_to_name || "\u2014")}</td>

function isValidPhoneClient(phone) {
  if (!phone) return true;
  const digits = phone.replace(/\D/g, "").replace(/^91/, "");
  return /^\d{10}$/.test(digits);
}
function isValidEmailClient(email) {
  if (!email) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim());
}
async function checkPhoneDuplicate(fieldId, warningId) {
  const phone = document.getElementById(fieldId).value.trim();
  const box = document.getElementById(warningId);
  if (!phone || !isValidPhoneClient(phone)) { box.innerHTML = ""; return; }
  try {
    const res = await api("/leads/check-duplicate?phone=" + encodeURIComponent(phone));
    if (res.duplicate) {
      box.innerHTML = `<div style="margin-top:6px;padding:8px 10px;background:#3A2A1F;border:1px solid #6B4A2A;border-radius:6px;font-size:12px;color:#F0A868;">
        \u26A0 Already in the system: <strong>${esc(res.name)}</strong> (${esc(res.status)}), assigned to ${esc(res.assignedToName)}. Double-check before adding a duplicate.
      </div>`;
    } else {
      box.innerHTML = "";
    }
  } catch (e) { box.innerHTML = ""; }
}

async function submitAddLead() {
  const name = document.getElementById("f_name").value.trim();
  if (!name) return showToast("Client name is required.");
  const phone = document.getElementById("f_phone").value.trim();
  const email = document.getElementById("f_email").value.trim();
  if (!isValidPhoneClient(phone)) return showToast("That phone number doesn't look right - use a 10-digit number.");
  if (!isValidEmailClient(email)) return showToast("That email address doesn't look right.");
  const body = {
    name, phone, email,
    source: document.getElementById("f_source").value, campaign: document.getElementById("f_campaign").value.trim(), lead_type: document.getElementById("f_lead_type").value,
    property_interest: document.getElementById("f_property").value.trim(), configuration: document.getElementById("f_config").value,

  try { await api("/leads", { method: "POST", body: JSON.stringify(body) }); showToast("Lead added"); state.tab = "leads"; await loadLeads(); }

  `;

function csvParse(text) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim());
  const headers = lines[0].split(",").map((h) => h.trim());
  return lines.slice(1).map((line) => {
    const cells = line.split(",");
    const row = {};
    headers.forEach((h, i) => { row[h] = (cells[i] || "").trim(); });
    return row;
  });
}

let pendingCsvRows = [];
function downloadCsvTemplate() {
  const headers = ["Name", "Phone", "Email", "Source", "Campaign", "Lead Type", "Property/Project", "Configuration",
    "Budget Min", "Budget Max", "Preferred Location", "Channel Partner", "Deal Value", "Follow-up Date", "Assigned To"];
  const example = ["Priya Nandakumar", "9845012345", "priya.n@example.com", "Instagram", "Diwali Offer 2026", "Buyer",
    "Palm Meadows Phase 2", "3BHK", "4000000", "5000000", "Whitefield", "", "4500000", "2026-08-15", "Aditi Rao"];
  const csvEscape = (v) => /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const csv = [headers.map(csvEscape).join(","), example.map(csvEscape).join(",")].join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "primark-realtors-lead-import-template.csv"; a.click();
  URL.revokeObjectURL(url);
}

function handleCsv(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const rows = csvParse(e.target.result);
    pendingCsvRows = rows;
    const headers = Object.keys(rows[0] || {});
    const get = (row, keys) => { for (const k of keys) { const found = Object.keys(row).find((rk) => rk.trim().toLowerCase() === k); if (found && row[found]) return row[found]; } return ""; };
    const knownPhones = new Set(state.leads.map((l) => (l.phone || "").replace(/\D/g, "")).filter(Boolean));
    const dupCount = rows.filter((r) => { const p = get(r, ["phone", "contact number", "contact"]).replace(/\D/g, ""); return p && knownPhones.has(p); }).length;
    document.getElementById("csvPreview").innerHTML = `
      <div class="card"><div class="card-title">Preview \u2014 ${rows.length} rows found</div>
        ${dupCount > 0 ? `<div style="margin-bottom:12px;padding:8px 10px;background:#3A2A1F;border:1px solid #6B4A2A;border-radius:6px;font-size:12.5px;color:#F0A868;">\u26A0 ${dupCount} row${dupCount > 1 ? "s" : ""} match a phone number already in your visible leads. They\u2019ll still import - review the "Leads" tab afterward to merge or disqualify duplicates.</div>` : ""}
        <div class="table-scroll"><table class="leads-table"><thead><tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}<th>Duplicate?</th></tr></thead>
        <tbody>${rows.slice(0, 5).map((r) => {
          const p = get(r, ["phone", "contact number", "contact"]).replace(/\D/g, "");
          const isDup = p && knownPhones.has(p);
          return `<tr>${headers.map((h) => `<td>${esc(r[h])}</td>`).join("")}<td>${isDup ? '<span class="overdue">Yes</span>' : "\u2014"}</td></tr>`;
        }).join("")}</tbody></table></div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button class="primary" onclick="confirmCsvImport()">Import ${rows.length} leads</button>
          <button class="ghost" onclick="document.getElementById('csvPreview').innerHTML=''">Cancel</button>
        </div>
      </div>`;
  };
  reader.readAsText(file);
}
async function confirmCsvImport() {
  const get = (row, keys) => { for (const k of keys) { const found = Object.keys(row).find((rk) => rk.trim().toLowerCase() === k); if (found && row[found]) return row[found]; } return ""; };
  const rows = pendingCsvRows.map((r) => ({
    name: get(r, ["name", "client name"]) || "Unnamed lead", phone: get(r, ["phone", "contact number", "contact"]),
    email: get(r, ["email", "email id"]), source: SOURCES.includes(get(r, ["source", "source of lead"])) ? get(r, ["source", "source of lead"]) : "Other",
    campaign: get(r, ["campaign", "campaign name"]),
    lead_type: LEAD_TYPES.includes(get(r, ["lead type", "leadtype"])) ? get(r, ["lead type", "leadtype"]) : "Buyer",
    property_interest: get(r, ["property", "property/project", "project", "property / project"]),
    configuration: CONFIGURATIONS.includes(get(r, ["configuration", "config"])) ? get(r, ["configuration", "config"]) : "",
    budget_min: get(r, ["budget min", "budgetmin", "budget min (\u20b9)"]),
    budget_max: get(r, ["budget max", "budgetmax", "budget max (\u20b9)"]),
    preferred_location: get(r, ["preferred location", "location"]),
    channel_partner: get(r, ["channel partner", "broker", "channel partner / broker"]),
    follow_up_date: get(r, ["follow-up date", "followup date", "follow up date"]),
    assigned_to: get(r, ["assigned to", "assignedto", "rep"]),
    deal_value: Number(get(r, ["dealvalue", "deal value", "value"])) || 0,
  }));
  try { const res = await api("/leads/import", { method: "POST", body: JSON.stringify({ rows }) }); showToast("Imported " + res.imported + " leads"); state.tab = "leads"; await loadLeads(); }
  catch (e) { showToast(e.message); }
}

    </div>
    ${s.byCampaign.length > 0 ? `
    <div class="card"><div class="card-title">Leads by campaign</div>
      <div class="rep-row rep-head"><div>Campaign</div><div>Leads</div><div></div><div>Won</div><div>Conversion</div><div>Open pipeline</div></div>
      ${s.byCampaign.map((c) => `<div class="rep-row"><div>${esc(c.campaign)}</div><div>${c.total}</div><div></div><div>${c.won}</div><div>${c.conversion}%</div><div>${money(c.pipelineValue)}</div></div>`).join("")}
      <div style="font-size:11.5px;color:var(--muted);margin-top:10px;">Compare this against what each campaign cost to run, on whichever ad platform's dashboard, for a true cost-per-lead and cost-per-conversion picture.</div>
    </div>` : ""}
    <div class="card"><div class="card-title">Aging tasks (overdue follow-ups)</div>
      ${s.aging.length === 0 ? `<div style="color:var(--muted);font-size:13px;">No overdue tasks.</div>` :
        `<div class="table-scroll"><table class="leads-table"><thead><tr><th>Client</th><th>Assigned</th><th>Status</th><th>Due</th><th>Overdue</th></tr></thead><tbody>
        ${s.aging.map((l) => `<tr><td>${esc(l.name)}</td><td>${esc(l.assigned_to_name)}</td><td><span class="badge" style="background:${STATUS_STYLE[l.status].bg};color:${STATUS_STYLE[l.status].text};">${l.status}</span></td><td>${fmtDate(l.follow_up_date)}</td><td class="overdue">${l.daysOverdue}d</td></tr>`).join("")}
        </tbody></table></div>`}
    </div>
    <div class="card"><div class="card-title">Potential revenue</div>
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">Open pipeline (full value)</div>${moneyValueHTML(s.pipelineValue, "gold")}</div>
        <div class="kpi-card"><div class="kpi-label">Weighted forecast</div>${moneyValueHTML(s.weightedValue, "teal")}</div>
      </div>
    </div>
    ${s.disqualified.length > 0 ? `<div class="card"><div class="card-title">Disqualified leads \u2014 by reason</div>${bars(s.byReason, "reason", "count", "#C9B380")}</div>` : ""}
    ${state.user.role === "super_admin" ? `
      <div class="card"><div class="card-title">Full data export</div>
        <p style="font-size:12.5px;color:var(--muted);margin:0 0 12px;">Downloads every lead in the system to a file you can open in Excel. Restricted to super admins.</p>
        <button class="primary" onclick="downloadAllLeads()">Download all leads (Excel/CSV)</button>
      </div>` : ""}
  `;
}
async function downloadAllLeads() {
  try {
    const headers = { Authorization: "Bearer " + state.token };
    const res = await fetch("/api/leads/export", { headers });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || "Export failed."); }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "primark-realtors-all-leads.csv"; a.click();
    URL.revokeObjectURL(url);
    state.backupChecked = false;
    showToast("Backup downloaded");
  } catch (e) { showToast(e.message); }
}

function teamTab() {
  if (!state.usersLoaded) { api("/users").then((d) => { state.users = d.users; state.usersLoaded = true; render(); }); return `<div style="color:var(--muted)">Loading team\u2026</div>`; }
  const canCreateAdmins = state.user.role === "super_admin";
  return `
    <h1 class="page-title">Team</h1>
    <p class="page-sub">Manage logins and roles. ${state.user.role === "admin" ? "You can manage team member accounts." : "You have full access as super admin."}</p>
    <div class="card"><div class="card-title">Add a team member</div>
      <div class="two-col">
        <div class="field-row"><label>Full name</label><input id="u_name" /></div>
        <div class="field-row"><label>User ID</label><input id="u_username" placeholder="e.g. arao" /></div>
      </div>
      <div class="two-col">
        <div class="field-row"><label>Temporary password</label><input id="u_password" type="text" /></div>
        <div class="field-row"><label>Role</label><select id="u_role">
          <option value="rep">Rep</option>
          ${canCreateAdmins ? `<option value="admin">Admin</option><option value="super_admin">Super admin</option>` : ""}
        </select></div>
      </div>
      <button class="primary" onclick="createUser()">Create account</button>
    </div>
    <div class="card"><div class="card-title">Existing accounts</div>
      <div class="table-scroll"><table class="leads-table"><thead><tr><th>Name</th><th>User ID</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
      ${state.users.map((u) => `<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.role.replace("_", " "))}</td>
        <td>${u.active ? "Active" : "Disabled"}</td>
        <td><button class="ghost" style="padding:5px 9px;font-size:11px;" onclick="editUsername(${u.id}, '${esc(u.username)}')">Edit ID</button>
        <button class="ghost" style="padding:5px 9px;font-size:11px;margin-left:6px;" onclick="resetPassword(${u.id})">Reset password</button>
        <button class="danger" style="margin-left:6px;" onclick="toggleActive(${u.id}, ${u.active ? 0 : 1})">${u.active ? "Block access" : "Unblock access"}</button></td></tr>`).join("")}
      </tbody></table></div>
    </div>
  `;
}
async function createUser() {
  const body = { name: document.getElementById("u_name").value.trim(), username: document.getElementById("u_username").value.trim(),
    password: document.getElementById("u_password").value, role: document.getElementById("u_role").value };
  try { await api("/users", { method: "POST", body: JSON.stringify(body) }); showToast("Account created"); state.usersLoaded = false; render(); }
  catch (e) { showToast(e.message); }
}
async function resetPassword(id) {
  const pw = prompt("New temporary password for this user:");
  if (!pw) return;
  try { await api("/users/" + id, { method: "PATCH", body: JSON.stringify({ newPassword: pw }) }); showToast("Password reset"); }
  catch (e) { showToast(e.message); }
}
async function editUsername(id, current) {
  const next = prompt("New user ID (what this person types to log in):", current);
  if (!next || next.trim() === current) return;
  try { await api("/users/" + id, { method: "PATCH", body: JSON.stringify({ username: next.trim() }) }); showToast("User ID updated"); state.usersLoaded = false; render(); }
  catch (e) { showToast(e.message); }
}
async function toggleActive(id, active) {
  try { await api("/users/" + id, { method: "PATCH", body: JSON.stringify({ active }) }); showToast("Updated"); state.usersLoaded = false; render(); }
  catch (e) { showToast(e.message); }
}

function renderTimeline(l) {
  const items = [
    ...(l.comments || []).map((c) => ({ kind: "comment", date: c.created_at, html: `<div class="comment">${esc(c.text)}<div class="comment-meta">${esc(c.author_name)} &middot; ${fmtDateTime(c.created_at)}</div></div>` })),
    ...(l.audit || []).map((a) => ({ kind: "audit", date: a.created_at, html: `<div class="audit-entry">${esc(a.user_name)} changed <strong>${esc(a.field)}</strong> from \u201c${esc(a.old_value || "\u2014")}\u201d to \u201c${esc(a.new_value || "\u2014")}\u201d<div class="comment-meta">${fmtDateTime(a.created_at)}</div></div>` })),
  ].sort((a, b) => new Date(b.date) - new Date(a.date));
  if (items.length === 0) return `<div style="font-size:12.5px;color:var(--muted);">No activity yet.</div>`;
  return items.map((i) => i.html).join("");
}

          <div><h2 style="margin:0;font-family:Georgia,serif;font-size:19px;">${esc(l.name)}</h2>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">Added ${fmtDateTime(l.created_at)} &middot; ${esc(l.source)}${l.campaign ? ` &middot; ${esc(l.campaign)}` : ""}</div></div>

        </div>

          <div class="field-row"><label>Status</label><select onchange="updateLead('${l.id}', {status:this.value, disqualify_reason: this.value==='Disqualified' ? '${DISQUALIFY_REASONS[0]}' : null})">
            ${STATUSES.map((s) => `<option ${l.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>

        <div class="field-row"><label>Assigned to</label><select onchange="reassignLead('${l.id}', this.value)">

        <div class="two-col">
          <div class="field-row"><label>Lead type</label><select onchange="updateLead('${l.id}', {lead_type:this.value})">${LEAD_TYPES.map((s) => `<option ${l.lead_type === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
          <div class="field-row"><label>Configuration</label><select onchange="updateLead('${l.id}', {configuration:this.value})">${CONFIGURATIONS.map((c) => `<option ${l.configuration === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>
        </div>
        <div class="two-col">
          <div class="field-row"><label>Property / project</label><input value="${esc(l.property_interest || "")}" onchange="updateLead('${l.id}', {property_interest:this.value})" /></div>
          <div class="field-row"><label>Preferred location</label><input value="${esc(l.preferred_location || "")}" onchange="updateLead('${l.id}', {preferred_location:this.value})" /></div>

        <div class="two-col">

async function updateLead(id, patch) {
  try { await api("/leads/" + id, { method: "PATCH", body: JSON.stringify(patch) }); await loadLeads(); }
  catch (e) { showToast(e.message); }
}
async function reassignLead(id, newUserId) {
  const user = state.teamRoster.find((u) => String(u.id) === String(newUserId));
  try {
    await api("/leads/" + id, { method: "PATCH", body: JSON.stringify({ assigned_to: Number(newUserId) }) });
    showToast(user ? "Reassigned to " + user.name : "Reassigned");
    await loadLeads();
  } catch (e) { showToast(e.message); }
}
async function submitComment(id) {
  const text = document.getElementById("commentBox").value.trim();
  if (!text) return;
  try { await api("/leads/" + id + "/comments", { method: "POST", body: JSON.stringify({ text }) }); await loadLeads(); }
  catch (e) { showToast(e.message); }
}

function sendWhatsAppTemplate(leadId, templateIndex) {
  if (templateIndex === "") return;
  const l = state.leads.find((x) => x.id === leadId);
  if (!l || !l.phone) return;
  const tmpl = WHATSAPP_TEMPLATES[Number(templateIndex)];
  const msg = tmpl.text
    .replace(/{name}/g, l.name || "there")
    .replace(/{rep}/g, state.user.name)
    .replace(/{property}/g, l.property_interest || "the property")
    .replace(/{visitDate}/g, l.site_visit_date ? fmtDate(l.site_visit_date) : "the scheduled date");
  window.open(waHref(l.phone, msg), "_blank");
}

function renderLogin() {
  root.innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <img class="login-logo" src="/logo.png" alt="Primark Realtors" />
      <h1>Primark Realtors CRM</h1>
      <p>Sign in with your team ID and password.</p>
      <div class="field-row"><label>User ID</label><input id="l_user" /></div>
      <div class="field-row"><label>Password</label><input id="l_pass" type="password" /></div>
      <button class="primary" style="width:100%;" onclick="doLogin()">Log in</button>
      ${state.loginError ? `<div class="login-error">${esc(state.loginError)}</div>` : ""}
    </div></div>
  `;
  setTimeout(() => { const el = document.getElementById("l_pass"); if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); }); }, 0);
}
function doLogin() {
  const u = document.getElementById("l_user").value.trim();
  const p = document.getElementById("l_pass").value;
  state.loginError = null;
  login(u, p);
}

function setTab(t) { state.tab = t; state.usersLoaded = t === "team" ? state.usersLoaded : state.usersLoaded; render(); }
function setSearch(v) { state.filters.search = v; render(); }
function setFilter(k, v) { state.filters[k] = v; render(); }
function openLead(id) { state.selectedId = id; render(); }
function closeLead() { state.selectedId = null; render(); }

window.setTab = setTab; window.setSearch = setSearch; window.setFilter = setFilter;
window.openLead = openLead; window.closeLead = closeLead; window.doLogin = doLogin; window.logout = logout;
window.submitAddLead = submitAddLead; window.handleCsv = handleCsv; window.confirmCsvImport = confirmCsvImport; window.checkPhoneDuplicate = checkPhoneDuplicate; window.downloadCsvTemplate = downloadCsvTemplate;
window.updateLead = updateLead; window.reassignLead = reassignLead; window.submitComment = submitComment; window.sendWhatsAppTemplate = sendWhatsAppTemplate; window.dismissA2HSTip = dismissA2HSTip;
window.createUser = createUser; window.resetPassword = resetPassword; window.toggleActive = toggleActive; window.editUsername = editUsername; window.downloadAllLeads = downloadAllLeads; window.changeOwnPassword = changeOwnPassword;

boot();
</script>
